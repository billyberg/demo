# Bygger sajten och publicerar den på GitHub Pages – varje gång du pushar.
#
# Slå på det en gång i repot:
#   Settings -> Pages -> Build and deployment -> Source: GitHub Actions

name: Publicera till GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bygg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Installera beroenden
        run: npm install

      - name: Bygg sajten
        run: npm run build

      - name: Ladda upp bygget
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  publicera:
    needs: bygg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
